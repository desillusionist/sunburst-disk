# Build and publish a release whenever a version tag is pushed.
#
# Pushing a `v*` tag (e.g. `git tag v0.3.7 && git push origin v0.3.7`) is the
# whole release: this workflow builds ONE universal macOS app + DMG on a macOS
# runner and attaches them to a draft GitHub Release. Universal means the same
# download runs natively on Apple Silicon and on Intel.
#
# Mirrors the local `npm run tauri:build` flow. The macOS 26 icon (Assets.car)
# and the Quick Look helper binary are committed, so the runner only needs to
# rebuild the Swift helper (both architectures) and the Rust/Tauri app.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Pinned to an arm64 image that GitHub Actions still hosts: macOS 14 was
    # retired on 2026-11-02, which silently cancelled every job that asked for it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both slices: tauri lipo-merges them into one universal binary.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Rebuild the Quick Look Swift helper for the runner as a universal binary.
      - run: npm run build:quicklook

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sunburst Disk ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install. Universal build (Apple Silicon + Intel).'
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      # Universal is the whole point of this job: fail loudly if a slice is
      # missing, rather than shipping a DMG that only half the Macs can run.
      - name: Verify both architectures are present
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Sunburst Disk.app"
          HELP="$(find "$APP/Contents/Resources" -name quicklook-preview -type f | head -1)"
          test -n "$HELP"
          for binary in "$APP/Contents/MacOS/sunburst-disk" "$HELP"; do
            echo "$binary -> $(lipo -archs "$binary")"
            lipo -archs "$binary" | grep -qw arm64
            lipo -archs "$binary" | grep -qw x86_64
          done
