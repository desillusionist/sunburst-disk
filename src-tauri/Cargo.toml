[package]
name = "sunburst-disk"
version = "0.3.10"
description = "A macOS disk usage analyzer with a visual sunburst, safe review tools and live updates."
authors = ["Sunburst Disk"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# The desktop binary plus a library target so tests can exercise the scanner
# without booting a webview.
[lib]
name = "sunburst_disk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No doctests; skip building the doc-test harness.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
libc = "0.2"
regex = "1"
sha2 = "0.10"
trash = "5"
notify = { version = "8", features = ["macos_fsevent"] }
tokio = { version = "1", features = ["sync"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSValue", "NSError"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
